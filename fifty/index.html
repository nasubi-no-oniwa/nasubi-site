 <div class="card">
  <div class="gname" id="rG"></div>
  <div class="pct" id="rPct"></div>
  <div class="dev" id="rDev"></div>
  <div class="facts" id="rFacts"></div>
  <div id="recArea">
   <p class="note" id="recNote"></p>
   <div id="recForm"><input id="nameIn" maxlength="12" autocomplete="off"><button id="recGo"></button></div>
  </div>
  <button class="x" id="xBtn"></button>
  <div class="row"><button class="img" id="imgBtn"></button><button class="vid" id="vidBtn"></button></div>
  <button class="huge" id="nextBtn"></button>
  <div class="row"><button class="sub" id="againBtn"></button><button class="sub" id="topBtn"></button></div>
  <button class="sub" id="rRank"></button>
 </div>
</div>

<div class="panel" id="vidPanel" hidden>
 <div class="card">
  <video id="vidPrev" playsinline controls loop hidden></video>
  <img id="imgPrev" hidden alt="">
  <p class="note" id="vMsg"></p>
  <button class="x" id="vShare"></button>
  <button id="vSave"></button>
  <button class="x" id="vX"></button>
  <button class="sub" id="vBack"></button>
 </div>
</div>
<div id="recBadge" hidden></div>

<div class="panel" id="rankPanel" hidden>
 <div class="card">
  <h2 id="rkTitle"></h2>
  <div class="tabs" id="rkDiff"><button data-d="e"></button><button data-d="n"></button><button data-d="h"></button></div>
  <div class="tabs" id="rkWhen"><button data-w="d"></button><button data-w="all"></button></div>
  <p class="note" id="rkNote"></p>
  <div id="rankBox"></div>
  <button class="sub" id="rankBack"></button>
 </div>
</div>

<div id="maker" hidden>
 <div id="mkTop"></div>
 <canvas id="mkDraw"></canvas>
 <div id="mkBar">
  <div class="mkrow"><span class="lab" id="mkLSec"></span><span id="mkScope"><button data-s="all"></button><button data-s="lo"></button><button data-s="hi"></button></span></div>
  <div id="mkSecs"></div>
  <div class="grid2">
   <div class="sl"><span id="mkLRim"></span><input type="range" id="mkRim" min="30" max="220" value="100"></div>
   <div class="sl"><span id="mkLWid"></span><input type="range" id="mkWid" min="50" max="170" value="100"></div>
   <div class="sl"><span id="mkLBot"></span><input type="range" id="mkBot" min="30" max="220" value="100"></div>
   <div class="sl"><span id="mkLHt"></span><input type="range" id="mkHt" min="30" max="185" value="95"></div>
   <div class="sl"><span id="mkLSt"></span><input type="range" id="mkSt" min="0" max="110" value="50"></div>
   <div class="sl"><span id="mkLTw"></span><input type="range" id="mkTw" min="-300" max="300" value="0"></div>
   <div class="sl"><span id="mkLAmp"></span><input type="range" id="mkAmp" min="5" max="45" value="30"></div>
  </div>
  <div id="mkCols"></div>
  <input id="mkName" maxlength="12" autocomplete="off">
  <div id="mkMsg"></div>
  <div class="row"><button class="sub" id="mkBack"></button><button class="sub" id="mkClear"></button><button class="huge" id="mkSave"></button></div>
 </div>
</div>

<div class="panel" id="madePanel" hidden>
 <div class="card">
  <h2 id="mdHead"></h2>
  <div class="gname" id="mdName"></div>
  <div class="code" id="mdCode"></div>
  <p id="mdHow"></p>
  <button class="huge" id="mdPlay"></button>
  <button class="x" id="mdX"></button>
  <button class="sub" id="mdCopy"></button>
  <button class="sub" id="mdTop"></button>
 </div>
</div>

<script type="module" src="main.js?v=6"></script>
</body>
</html>
