   const s={...pick(RUN),p};const res=p%2===0?'h':'t';applyP=applyNet(s).then(nx=>{RUN.la=nx.la;RUN.p=0;saveRun();}).catch(e=>{console.warn(e);applyP=Promise.resolve();});return res;}
  // はじかれた：投げるのが速すぎる・前の結果が書けていない・手元とサーバーがずれている
  await sleep(450);try{const s=await getRun();if(!s||typeof s.st!=='number'){await newRun();}else if(s.p>0){const nx=await applyNet(pick(s));const before=RUN.h+RUN.t;await syncRun();if(RUN.h+RUN.t!==before){/* 前の結果がやっと入った */}}else if(s&&(s.st!==RUN.st||s.h!==RUN.h||s.t!==RUN.t))await syncRun();}catch(e){}}
 throw new Error('toss');}
const dayKey=ms=>Math.floor((ms+32400000)/86400000);
const DS=100000,TOPN=100;
async function submit(nm){if(PV)return {rd:3,ra:12,better:true};
 await applyP;const a=await fbAuth();const s=await getRun();if(s.p>0)await applyNet(pick(s));const cur=pick(await getRun());
 if(cur.st!==RUN.st||cur.h!==RUN.h||cur.t!==RUN.t){await syncRun();}
 const k=kOf(cur.h,cur.t),pk=kOf(cur.ph,cur.pt);const rec={n:nm,h:cur.h,t:cur.t,ph:cur.ph,pt:cur.pt,st:cur.st,k,pk,v:1,at:TS};const dk=dayKey(Date.now());const recD={...rec,dk,ds:dk*DS+k+1000};
 const lg=await PUT(DB('lg/'+a.uid)+QA(a),{k,c:cur.h+cur.t,st:cur.st,at:TS});if(!lg.ok)throw new Error('lg '+lg.status);
 const [old,oldD]=await Promise.all([fetchR(DB('all/scores/'+a.uid)+'.json').then(x=>x.ok?x.json():null).catch(()=>null),fetchR(DB('d/scores/'+a.uid)+'.json').then(x=>x.ok?x.json():null).catch(()=>null)]);
 const okA=!old||old.k<k,okD=!oldD||oldD.dk!==dk||oldD.k<k;
 if(okD){const r=await PUT(DB('d/scores/'+a.uid)+QA(a),recD);if(!r.ok)throw new Error('d '+r.status);}
 else if(oldD&&oldD.n!==nm){await PUT(DB('d/scores/'+a.uid)+QA(a),{...oldD,n:nm,at:TS}).catch(()=>{});}
 if(okA){const r=await PUT(DB('all/scores/'+a.uid)+QA(a),rec);if(!r.ok)throw new Error('all '+r.status);}
 else if(old&&old.n!==nm){await PUT(DB('all/scores/'+a.uid)+QA(a),{...old,n:nm,at:TS}).catch(()=>{});}
 const [rd,ra]=await Promise.all([myRank('d',a.uid),myRank('all',a.uid)]);return {rd,ra,better:okA};}
async function loadBoard(board){const today=dayKey(Date.now());
 const url=board==='d'?DB('d/scores')+'.json?orderBy=%22ds%22&startAt='+(today*DS)+'&endAt='+(today*DS+DS-1)+'&limitToLast='+TOPN:DB('all/scores')+'.json?orderBy=%22k%22&limitToLast='+TOPN;
 const [d,h]=await Promise.all([fetch(url).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch(DB('hidden')+'.json').then(r=>r.ok?r.json():null).catch(()=>null)]);
 const rows=Object.entries(d||{}).map(([id,v])=>({...v,id})).filter(r=>!(h&&h[r.id])&&typeof r.k==='number').sort((a,b)=>b.k-a.k||a.at-b.at);
 rows.forEach((r,i)=>{r.rk=i>0&&Math.abs(rows[i-1].k-r.k)<1e-9?rows[i-1].rk:i+1;});return rows;}
const rankTxt=r=>r?t('rankN',{r}):t('rankOut');
async function myRank(board,uid){try{const rows=await loadBoard(board);const r=rows.find(x=>x.id===uid);return r?r.rk:null;}catch(e){return null;}}
let rankFrom=null;
const rowH=(r,me)=>'<tr'+(me?' class="me"':'')+'><td class="r">'+r.rk+'</td><td class="n">'+esc(r.n)+'<br><small style="color:var(--sub);font-size:11px">'+esc(t('rowSub',{n:r.h+r.t,p:fmt(money(r.ph,r.pt))}))+'</small></td><td class="c">'+(r.k<BANK?esc(t('bank')):fmt(START*Math.exp(r.k))+'🍆')+'</td></tr>';
async function openRank(board,from){rankFrom=from||null;show('rankPanel');$('tabDay').classList.toggle('on',board==='d');$('tabAll').classList.toggle('on',board==='all');$('tabDay').onclick=()=>openRank('d',rankFrom);$('tabAll').onclick=()=>openRank('all',rankFrom);
 const box=$('rankBox');box.innerHTML='<p>'+t('loading')+'</p>';
 if(PV){const demo=[{n:'ドパ吉',h:14,t:5,ph:14,pt:4},{n:'やめどき',h:5,t:1,ph:5,pt:0},{n:ls.get('kg_name','なすび'),h:3,t:1,ph:3,pt:0},{n:'破産王',h:2,t:19,ph:2,pt:0}].map((r,i)=>({...r,k:kOf(r.h,r.t),at:i}));demo.forEach((r,i)=>{r.rk=i+1;});box.innerHTML='<table class="rank">'+demo.map(r=>rowH(r,r.n===ls.get('kg_name','なすび'))).join('')+'</table>';return;}
 try{const rows=await loadBoard(board);const myId=(ls.get('kg_auth',null)||{}).uid;let h='<table class="rank">'+rows.slice(0,TOPN).map(r=>rowH(r,r.id===myId)).join('');if(!rows.length)h+='<tr><td></td><td colspan="2">'+t('empty')+'</td></tr>';box.innerHTML=h+'</table>';}
 catch(e){box.innerHTML='<p>'+t('rankerr')+'</p>';}}
$('rankBtn').onclick=()=>openRank('d');$('fRank').onclick=()=>openRank('d','fin');
$('rankBack').onclick=()=>{if(rankFrom==='fin')showFin();else showTitle();};

const FXC=$('fx'),fxg=FXC.getContext('2d');let fxW=0,fxH=0;

addEventListener('resize',fxSize);fxSize();
function loop(now){requestAnimationFrame(loop);const raw=Math.min(.5,Math.max(0,(now-last)/1000)),dt=Math.min(.05,raw);last=now;
 if(mode==='video')return;

 R.render(SC,CAM);}

else if(ICON){R.setPixelRatio(1);R.setSize(512,512,false);CAM.aspect=1;CAM.fov=30;CAM.position.set(0,4.2,.01);CAM.lookAt(0,0,0);CAM.updateProjectionMatrix();applyPose({x:0,y:coinH/2,z:0,ang:0,yaw:0,wob:0});R.render(SC,CAM);window.__ready=1;}
else{resize();
 if(!PV){runReady=fbAuth().then(()=>syncRun()).catch(e=>{console.warn(e);});}else runReady=Promise.resolve();
 showTitle();requestAnimationFrame(loop);}
