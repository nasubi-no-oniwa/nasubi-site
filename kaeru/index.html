#routeL{font-size:12px;color:var(--sub);font-weight:700;margin:6px 0 2px}
#recBox{margin-top:12px;position:relative}
#nm{width:100%;font:inherit;font-size:16px;font-weight:700;padding:11px 10px;border:2px solid var(--ink);border-radius:999px;background:#fff;text-align:center}

.note.err{color:var(--red)}.note.ok{color:var(--leaf)}
.tabs{display:flex;gap:6px;margin:10px 0 6px;position:relative}

<canvas id="gl"></canvas>
